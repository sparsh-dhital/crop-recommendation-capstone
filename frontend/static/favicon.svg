<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="20" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#064e3b" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect width="64" height="64" rx="16" fill="url(#shieldGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" fill="none"/>
  <!-- Ambient golden sun / energy particle -->
  <circle cx="46" cy="18" r="5" fill="url(#accentGrad)"/>
  <!-- Leaf and sprout motif -->
  <g filter="url(#glow)">
    <path d="M32 48 C 32 36, 42 26, 47 24 C 47 34, 40 45, 32 48 Z" fill="url(#leafGrad)"/>
    <path d="M32 48 C 30 38, 20 33, 17 33 C 17 41, 25 47, 32 48 Z" fill="#a7f3d0"/>
    <path d="M32 48 C 32 35, 34 22, 36 17" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>

